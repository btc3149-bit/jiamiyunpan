[workspace]
resolver = "2"
members = [
  "admin",
  "auth",
  "config",
  "context",
  "cryptfns",
  "email",
  "entity",
  "error",
  "fs",
  "server",
  "links",
  "migration",
  "settings",
  "shares",
  "storage",
  "transfer",
  "util",
]

[workspace.dependencies]
# Actix ecosystem
actix-web = "^4.11"
actix-cors = "^0.7"
actix-multipart = "^0.7"

# Async runtime
tokio = "^1"
async-trait = "0.1.57"
futures = "^0.3"
futures-util = "^0.3"
async-std = { version = "^1", features = ["attributes", "tokio1"] }

# Serialization
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"

# Logging
log = "^0.4"
env_logger = "^0.10"

# Date/time
chrono = { version = "0.4.23", features = ["serde"] }

# Validation
validr = "^0.3"

# Database
sea-orm = { version = "^1.1", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-actix-rustls", "macros"] }
sea-orm-migration = { version = "^1.1", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-actix-rustls"] }

# Crypto & security
# ring provider: aws-lc-rs (rustls 0.23 default) needs cmake/perl and is
# unreliable on armv6/armv7 musl cross builds; ring cross-compiles cleanly.
rustls = { version = "^0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "^2"
rcgen = "^0.13"
rsa = { version = "^0.8", features = ["sha2"] }
der = { version = "^0.6", features = ["derive", "oid", "alloc"] }
base64 = "^0.21"
hex = "^0.4"
jsonwebtoken = { version = "^10", features = ["rust_crypto"] }

# HTTP client
# rustls backend only: reqwest's default native-tls pulls openssl-sys, which
# does not survive the musl/static cross builds (and we ship rustls anyway).
reqwest = { version = "^0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "json", "stream"] }

# Object storage
s3 = { package = "rust-s3", version = "^0.36", default-features = false, features = ["tokio-rustls-tls"] }

# Utilities
uuid = { version = "1.2.2", features = ["serde", "v4", "v7"] }
url = "^2"
glob = "^0.3"
num-traits = "0.2"

# Email
# rustls backend: lettre's default native-tls pulls openssl-sys, which breaks
# the musl/static cross builds (same rationale as reqwest above).
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "rustls-tls"] }
handlebars = "^4"

# Other
thiserror = "^1"
dotenv = "^0.15"
clap = { version = "^4", features = ["string"] }
path-absolutize = "^3"
fs4 = "^0.6"
pin-project = "^1"
cached = "^0.43"
strum = "0.24"
strum_macros = "0.24"
zxcvbn = "2.2.1"
google-authenticator = "0.3.0"
bcrypt = "^0.14"
qstring = "^0.7"

[workspace.lints.rust.unexpected_cfgs]
# Allow wasm-bindgen internal cfg flags used by macros
level = "warn"
check-cfg = ["cfg(wasm_bindgen_unstable_test_coverage)"]

